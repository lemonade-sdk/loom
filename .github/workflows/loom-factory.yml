name: loom-factory

# Each run ports one GGUF LLM to Loom on the self-hosted Strix Halo and publishes the package to
# huggingface.co/loom-fun. Without a checkpoint input it takes the highest-trending GGUF chat LLM
# (of the top 20 that fit) that loom-fun doesn't have yet, and skips if another run is active.
# Scheduled runs only consider repositories published by the approved organizations listed in
# PUBLISHERS in .github/scripts/loom_factory.py.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "HF GGUF repo to convert, as org/repo or org/repo:path/to/file.gguf (empty = next of the top 20)"
        required: false
        default: ""
      optimize_hours:
        description: "Optimization budget after the port passes the correctness gate (0 = port and validate only)"
        required: false
        default: "1"

permissions:
  contents: read

env:
  HF_ORG: loom-fun
  TOP_N: 20
  # Strix Halo GPU budget is ~61 GiB GTT; leave room for the KV pool and workspace.
  MAX_WEIGHTS_GIB: 48
  # Models that failed this many times in the last ARTIFACT_DAYS are skipped by scheduled runs.
  MAX_ATTEMPTS: 2
  ARTIFACT_DAYS: 30
  # Models downloaded by a run are kept for reuse unless less than this much disk is free when it ends.
  MIN_FREE_GB: 150
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_01H4DUTGWQpKxWJo6syehWrW
  ANTHROPIC_ORGANIZATION_ID: 9bdff596-1595-4140-8301-817e43ef8412
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01RaWseoyo5MeWhBYqZYEkfr
  ANTHROPIC_WORKSPACE_ID: wrkspc_01DcG9t7asPHNeFbcKtktSu3
  ANTHROPIC_MODEL: claude-opus-5-5

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      found: ${{ steps.pick.outputs.found }}
      source: ${{ steps.pick.outputs.source }}
      target: ${{ steps.pick.outputs.target }}
      slug: ${{ steps.pick.outputs.slug }}
      quant: ${{ steps.pick.outputs.quant }}
      files: ${{ steps.pick.outputs.files }}
      gib: ${{ steps.pick.outputs.gib }}
    steps:
      - uses: actions/checkout@v5

      # An explicitly requested checkpoint never skips; it queues for the runner instead.
      - name: Skip if an earlier run is still active
        id: busy
        if: inputs.checkpoint == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" --jq \
            "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status | IN(\"queued\",\"in_progress\",\"waiting\",\"pending\",\"requested\"))) | .html_url] | join(\" \")")
          if [ -n "$active" ]; then
            echo "Skipping: another loom-factory run is active: $active" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the model
        id: pick
        if: steps.busy.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_LOOM_FACTORY }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' > attempts.txt
          python3 .github/scripts/loom_factory.py select --org "$HF_ORG" --top "$TOP_N" --max-gib "$MAX_WEIGHTS_GIB" \
            --max-attempts "$MAX_ATTEMPTS" --attempts-file attempts.txt ${CHECKPOINT:+--checkpoint "$CHECKPOINT"}

  convert:
    needs: select
    if: needs.select.outputs.found == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 600
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      TARGET: ${{ needs.select.outputs.target }}
      SLUG: ${{ needs.select.outputs.slug }}
      QUANT: ${{ needs.select.outputs.quant }}
      FILES: ${{ needs.select.outputs.files }}
      GIB: ${{ needs.select.outputs.gib }}
      OPTIMIZE_HOURS: ${{ inputs.optimize_hours || '1' }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare the work directory
        run: |
          set -euo pipefail
          WORK=$HOME/loom-factory/$SLUG
          rm -rf "$WORK"
          mkdir -p "$WORK/serve"
          printf '{"source":"%s","quant":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$SOURCE" "$QUANT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$WORK/attempt.json"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "LOOM_SERVE_STATE=$WORK/serve" >> "$GITHUB_ENV"
          echo "Converting [$SOURCE](https://huggingface.co/$SOURCE) ($QUANT, $GIB GiB) → [$TARGET](https://huggingface.co/$TARGET)" >> "$GITHUB_STEP_SUMMARY"

      - name: Get the GGUF (reuse a local copy if present)
        env:
          HF_TOKEN: ${{ secrets.HF_LOOM_FACTORY }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install -q -U huggingface_hub
          "$RUNNER_TEMP/hf/bin/python" - <<'EOF'
          import json, os
          from huggingface_hub import HfApi, constants, hf_hub_download, try_to_load_from_cache

          src, work = os.environ["SOURCE"], os.environ["WORK"]
          dest = os.path.join(work, "gguf")
          # The published model.json pins this revision, so loom-fetch gets the GGUF the port was validated on.
          rev = HfApi().model_info(src).sha
          json.dump({"revision": rev}, open(os.path.join(work, "source.json"), "w"))
          # Repos already in the shared cache belong to someone else; cleanup must leave them alone.
          cache = constants.HF_HUB_CACHE
          before = sorted(d for d in os.listdir(cache) if d.startswith("models--")) if os.path.isdir(cache) else []
          json.dump({"cache": cache, "repos": before}, open(os.path.join(work, "hf-cache-before.json"), "w"))
          lines, downloaded = [], []
          for f in json.loads(os.environ["FILES"]):
              path = os.path.join(dest, f)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              cached = try_to_load_from_cache(src, f, revision=rev)
              if isinstance(cached, str) and os.path.exists(cached):
                  lines.append(f"- `{f}`: already available locally ({cached}), not downloaded")
              else:
                  # Into the cache, so a copy kept after the run is found by the check above next time.
                  cached = hf_hub_download(src, f, revision=rev)
                  downloaded.append(cached)
                  lines.append(f"- `{f}`: not available locally, downloaded "
                               f"({os.path.getsize(cached) / 2**30:.1f} GiB)")
              os.symlink(os.path.realpath(cached), path)
          json.dump(downloaded, open(os.path.join(work, "hf-downloaded.json"), "w"))
          report = "\n".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n" + report + "\n")
          EOF

      - name: Install Claude Code
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          claude --version

      # Older local builds may not know a new model's architecture. Each release is kept in its own
      # directory, where pick_llamacpp.sh finds it next to the other builds.
      - name: Get the latest llama.cpp ROCm build
        env:
          GH_TOKEN: ${{ github.token }}
          LLAMACPP_REPO: lemonade-sdk/llamacpp-rocm
          LLAMACPP_ASSET: ubuntu-rocm-gfx1151-x64.zip
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, shutil, tempfile, urllib.request, zipfile

          repo, suffix = os.environ["LLAMACPP_REPO"], os.environ["LLAMACPP_ASSET"]
          auth = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}"}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases/latest", headers=auth)
          rel = json.load(urllib.request.urlopen(req))
          tag = rel["tag_name"]
          asset = next(a for a in rel["assets"] if a["name"].endswith(suffix))
          root = os.path.expanduser("~/llamacpp-rocm")
          dest = os.path.join(root, tag)
          if os.path.isdir(dest):
              msg = f"llama.cpp ROCm {tag}: already available locally ({dest}), not downloaded"
          else:
              os.makedirs(root, exist_ok=True)
              tmp = tempfile.mkdtemp(dir=root, prefix=f".{tag}-")
              try:
                  zpath = os.path.join(tmp, asset["name"])
                  urllib.request.urlretrieve(asset["browser_download_url"], zpath)
                  out = os.path.join(tmp, "build")
                  with zipfile.ZipFile(zpath) as z:
                      z.extractall(out)
                  # zipfile drops the executable bit.
                  for d, _, files in os.walk(out):
                      for f in files:
                          if f.startswith("llama-") and "." not in f:
                              os.chmod(os.path.join(d, f), 0o755)
                  os.rename(out, dest)
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
              msg = f"llama.cpp ROCm {tag}: downloaded {asset['name']} to {dest}"
          server = next((os.path.join(d, "llama-server") for d, _, files in os.walk(dest) if "llama-server" in files), None)
          if not server:
              raise SystemExit(f"::error::{asset['name']} has no llama-server")
          print(msg)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"LLAMACPP_LATEST={os.path.dirname(server)}\nLLAMACPP_LATEST_TAG={tag}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"\n- {msg}\n")
          EOF

      - name: Check that the llama.cpp build sees the GPU
        run: |
          set -euo pipefail
          cd "$LLAMACPP_LATEST"
          LD_LIBRARY_PATH=$PWD ./llama-server --list-devices 2>&1 | grep ROCm \
            || echo "::warning::llama.cpp ROCm $LLAMACPP_LATEST_TAG at $LLAMACPP_LATEST lists no ROCm device"

      - name: Port the model with the Loom skills
        timeout-minutes: 540
        run: |
          set -euo pipefail
          # Claude Code exchanges this JWT through workload identity federation and re-reads the file at
          # every refresh. GitHub JWTs live ~5 min and are single-use, so keep rotating it.
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-jwt"
          fetch_jwt() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])' > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_jwt
          ( while sleep 60; do fetch_jwt || echo "JWT refresh failed; retrying"; done ) &
          refresher=$!
          trap 'kill $refresher 2>/dev/null' EXIT
          # A static credential on the runner would shadow federation.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN

          files=$(python3 -c 'import json, os; print(", ".join("gguf/" + f for f in json.loads(os.environ["FILES"])))')
          if [ "$OPTIMIZE_HOURS" = "0" ]; then
            goal="Port it, pass the loom-benchmark correctness gate against llama.cpp ROCm, measure the llama.cpp baseline and Loom's performance, and report. Skip optimization."
          else
            goal="Get it working on loom-serve, optimize it for $OPTIMIZE_HOURS hour(s), and report the performance relative to llama.cpp ROCm (the full end-to-end pipeline of the loom skill, including roofline, gates and audit)."
          fi
          cat > "$WORK/prompt.md" <<EOF
          Use the Loom skills to port the Hugging Face GGUF checkpoint $SOURCE ($QUANT) to Loom.
          $goal

          This is an unattended CI run on the Strix Halo; nobody can answer questions, so never stop to ask.
          - Working directory: $WORK. The GGUF is already downloaded: $files.
            If it is split into shards, merge them into one GGUF in $WORK/gguf first. Never modify or
            delete files outside $WORK; the GGUF may be a symlink into the shared Hugging Face cache.
            Download any other model into the Hugging Face cache (hf download without --local-dir).
          - Write the finished package to $WORK/pkg (model.json, program/*.loom, weights.loom, tokenizer.json,
            llm_config.json), the benchmark/roofline outputs to $WORK/bench, and the final report to $WORK/REPORT.md.
          - Reuse the Loom install at ~/loom if present (install it with loom-setup otherwise) and the llama.cpp
            ROCm builds already on this machine. The latest lemonade-sdk/llamacpp-rocm release
            ($LLAMACPP_LATEST_TAG) was just installed in $LLAMACPP_LATEST for this run; pick_llamacpp.sh ranks it
            with the others. Do not download and run any other binaries. If no usable llama.cpp ROCm build
            exists, fail.
          - Start loom-serve only through the loom-setup serve.sh script (LOOM_SERVE_STATE is set), and stop
            every server you started before you finish.
          - Finish by writing $WORK/result.json:
            {"status": "ok" or "failed", "reason": "<one line>", "metrics": {<headline numbers from the report>}}
            Use "ok" only if the package serves and passed the correctness gate.
          EOF
          cd "$WORK"
          claude -p "$(cat prompt.md)" --plugin-dir "$GITHUB_WORKSPACE" --model "$ANTHROPIC_MODEL" \
            --permission-mode bypassPermissions --output-format stream-json --verbose \
            | tee claude.jsonl | python3 -c '
          import json, sys
          for line in sys.stdin:
              try: m = json.loads(line)
              except ValueError: continue
              for c in (m.get("message") or {}).get("content") or []:
                  if isinstance(c, dict) and c.get("type") == "text": print(c["text"], flush=True)
              if m.get("type") == "result": print("== result:", m.get("subtype"), m.get("total_cost_usd"), flush=True)
          '

      - name: Check the result
        run: |
          set -euo pipefail
          test -f "$WORK/result.json" || { echo "::error::the agent wrote no result.json"; exit 1; }
          cat "$WORK/result.json"
          python3 - <<'EOF'
          import glob, json, os, sys
          w = os.environ["WORK"]
          r = json.load(open(f"{w}/result.json"))
          if r.get("status") != "ok":
              sys.exit(f"::error::port failed: {r.get('reason')}")
          if not os.path.isfile(f"{w}/pkg/model.json") or not glob.glob(f"{w}/pkg/**/*.loom", recursive=True):
              sys.exit("::error::result is ok but pkg/ has no model.json or .loom files")
          EOF
          { echo "### Report"; echo; cat "$WORK/REPORT.md" 2>/dev/null || echo "_no REPORT.md_"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_LOOM_FACTORY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf/bin/python" .github/scripts/loom_factory.py publish --work "$WORK" \
            --source "$SOURCE" --target "$TARGET" --quant "$QUANT" --files "$FILES" \
            --loom-fetch "$HOME/loom/.venv/bin/loom-fetch"
          echo "Published https://huggingface.co/$TARGET" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop leftover servers
        if: always()
        run: |
          for f in "$WORK"/serve/*.pid; do
            [ -f "$f" ] && "$GITHUB_WORKSPACE/skills/loom-setup/scripts/stop.sh" "$(basename "$f" .pid)" || true
          done
          for f in $(find /tmp -maxdepth 1 -name 'llamacpp-*.pid' -newer "$WORK/attempt.json" 2>/dev/null); do
            pid=$(cat "$f")
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | grep -q llama-server && kill "$pid" || true
            rm -f "$f"
          done

      - name: Delete downloaded models if disk space is low
        if: always()
        run: |
          set -uo pipefail
          [ -n "${WORK:-}" ] || exit 0
          # Work-directory copies (links into the cache, merged GGUFs) are never reused; symlinks are
          # removed without touching their targets.
          rm -rf "$WORK/gguf"
          find "$WORK" \( -name '*.gguf' -o -name '*.safetensors' \) \( -type f -o -type l \) -print -delete
          [ -f "$WORK/hf-cache-before.json" ] || exit 0
          "$RUNNER_TEMP/hf/bin/python" - <<'EOF'
          import json, os, shutil
          work = os.environ["WORK"]
          s = json.load(open(os.path.join(work, "hf-cache-before.json")))
          cache, min_free = s["cache"], float(os.environ["MIN_FREE_GB"]) * 1e9
          downloaded = json.load(open(os.path.join(work, "hf-downloaded.json"))) \
              if os.path.exists(os.path.join(work, "hf-downloaded.json")) else []
          # This run's GGUF downloads, plus cache repos that first appeared during the run (e.g. fetched by
          # the agent). Anything that was in the cache before the run is never deleted.
          new_repos = sorted(d for d in set(os.listdir(cache)) - set(s["repos"]) if d.startswith("models--")) \
              if os.path.isdir(cache) else []
          free = shutil.disk_usage(cache if os.path.isdir(cache) else work).free
          if free >= min_free:
              msg = (f"{free / 1e9:.0f} GB free (at least {min_free / 1e9:.0f} GB): kept this run's models in the "
                     f"Hugging Face cache for reuse.")
          else:
              for snap in downloaded:
                  for p in (os.path.realpath(snap), snap):
                      if os.path.lexists(p):
                          os.remove(p)
              for d in new_repos:
                  shutil.rmtree(os.path.join(cache, d), ignore_errors=True)
              after = shutil.disk_usage(cache if os.path.isdir(cache) else work).free
              msg = (f"{free / 1e9:.0f} GB free (under {min_free / 1e9:.0f} GB): deleted this run's models "
                     f"({len(downloaded)} downloaded files, {len(new_repos)} new cache repos), now {after / 1e9:.0f} GB free.")
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(msg + "\n")
          EOF

      # Scheduled runs count these to stop retrying a model that keeps failing.
      - name: Upload the attempt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-factory-attempt-${{ env.SLUG }}-${{ github.run_id }}
          retention-days: ${{ env.ARTIFACT_DAYS }}
          if-no-files-found: ignore
          path: |
            ${{ env.WORK }}/attempt.json
            ${{ env.WORK }}/prompt.md
            ${{ env.WORK }}/claude.jsonl
            ${{ env.WORK }}/result.json
            ${{ env.WORK }}/REPORT.md
            ${{ env.WORK }}/serve-check.log
            ${{ env.WORK }}/bench/**/*.json
            ${{ env.WORK }}/bench/**/*.jsonl
            ${{ env.WORK }}/bench/**/*.md
