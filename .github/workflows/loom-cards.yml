name: loom-cards

# Brings the install instructions on the model cards already published to huggingface.co/loom-fun in
# line with the ones loom-factory writes for new packages.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the cards that would change"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update the cards
        env:
          HF_TOKEN: ${{ secrets.HF_LOOM_FACTORY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install -q -U huggingface_hub
          "$RUNNER_TEMP/hf/bin/python" .github/scripts/loom_factory.py cards --org loom-fun \
            $([ "$DRY_RUN" = "true" ] && echo --dry-run) | tee -a "$GITHUB_STEP_SUMMARY"
